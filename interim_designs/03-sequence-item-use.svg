<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 508" width="910" height="508" role="img" aria-labelledby="t d">
<title id="t">Interim sequence diagram: using an item</title>
<desc id="d">Interim UML sequence diagram. The person presses a key. GameScreen calls useItem on Player. Player calls getSelected on Inventory, which returns the selected item. Player calls use on Item, which returns when the effect is done. Player calls remove on Inventory. Inventory calls incrementCount on HUD.</desc>
