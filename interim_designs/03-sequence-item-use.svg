<line x1="380" y1="86" x2="380" y2="494" stroke="#20211d" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="471.0" y="48" width="118" height="38" fill="#ffffff" stroke="#20211d" stroke-width="1.5"/>
<text x="530" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#20211d">Item</text>
