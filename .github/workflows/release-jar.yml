name: Build and publish JAR

on:
  push:
    branches: [main]
    paths-ignore: ['index.html', 'styles.css', 'script.js', 'charts/**', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build runnable JAR (all dependencies + native libs included)
        run: ./gradlew :lwjgl3:jar
      - name: Publish to the rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp lwjgl3/build/libs/goose-game-*.jar goose-game.jar
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest goose-game.jar --latest \
              --title "Latest build" \
              --notes "Runnable JAR of the current main branch. Run with: java -jar goose-game.jar (Java 17+)."
          else
            gh release upload latest goose-game.jar --clobber
            gh release edit latest --target "$GITHUB_SHA"
          fi
